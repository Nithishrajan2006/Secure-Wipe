spring:
  datasource:
    url: jdbc:mysql://mysql:3306/securewipe_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:securewipe_user}
    password: ${DB_PASSWORD:SecureWipe@2024}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://frontend:80,http://securewipe-frontend:80}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.securewipe: INFO
    org.springframework: WARN
