server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml;

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---------------------------------------------------------------------------
    # BACKEND TARGET SELECTION
    #
    # For Docker Compose (both frontend + backend in Docker):
    #   proxy_pass http://securewipe-backend:8080/api/;
    #
    # For local backend (mvn spring-boot:run on host, only frontend in Docker):
    #   proxy_pass http://host.docker.internal:8080/api/;
    #
    # host.docker.internal resolves to the host machine from inside a container.
    # On Linux hosts, add this to docker-compose.yml under the frontend service:
    #   extra_hosts:
    #     - "host.docker.internal:host-gateway"
    # ---------------------------------------------------------------------------

    location /api/ {
        proxy_pass         http://host.docker.internal:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Proxy WebSocket (STOMP/SockJS) for real-time progress
    location /ws/ {
        proxy_pass         http://host.docker.internal:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy Swagger UI
    location /swagger-ui/ {
        proxy_pass         http://host.docker.internal:8080/swagger-ui/;
        proxy_set_header   Host $host;
    }

    location /v3/api-docs {
        proxy_pass         http://host.docker.internal:8080/v3/api-docs;
        proxy_set_header   Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-XSS-Protection       "1; mode=block"                    always;
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
