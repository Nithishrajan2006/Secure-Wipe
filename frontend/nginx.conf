
location /api/ {
    proxy_pass https://secure-wipe-backend-docker.onrender.com/api/;
    proxy_ssl_server_name on;
    proxy_set_header Host secure-wipe-backend-docker.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
}

location /ws/ {
    proxy_pass https://secure-wipe-backend-docker.onrender.com/ws/;
    proxy_ssl_server_name on;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host secure-wipe-backend-docker.onrender.com;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location /swagger-ui/ {
    proxy_pass https://secure-wipe-backend-docker.onrender.com/swagger-ui/;
    proxy_ssl_server_name on;
    proxy_set_header Host secure-wipe-backend-docker.onrender.com;
}

location /v3/api-docs {
    proxy_pass https://secure-wipe-backend-docker.onrender.com/v3/api-docs;
    proxy_ssl_server_name on;
    proxy_set_header Host secure-wipe-backend-docker.onrender.com;
}
